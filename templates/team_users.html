<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Usuarios · Encomienda Jireh</title><style>body{font:16px Arial;background:#f1f4f1;color:#24342d;margin:0;padding:32px}.box{max-width:760px;margin:auto;background:white;border-radius:20px;padding:28px;box-shadow:0 10px 35px #16352b18}input,button{padding:12px;border:1px solid #ccd7d1;border-radius:9px;font:inherit;margin:5px}button{background:#087f62;color:white;cursor:pointer}li{padding:12px;border-bottom:1px solid #eee}.muted{color:#758078}</style></head><body><main class="box"><h1>Usuarios del equipo</h1><p class="muted">Cada persona entra con su cuenta. Las acciones quedan atribuidas a su usuario.</p><form id="create"><input name="username" placeholder="Usuario" required minlength="3"><input name="displayName" placeholder="Nombre visible" required><input name="password" type="password" placeholder="Contraseña (12 caracteres mínimo)" required minlength="12"><button>Crear usuario</button></form><ul id="users"></ul><a href="/">Volver a la app</a></main><script>const csrf=document.querySelector('meta[name=csrf-token]').content;async function api(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined}),j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}async function load(){let d=await api('/api/users');document.querySelector('#users').innerHTML=d.users.map(u=>`<li><b>${u.displayName}</b> · ${u.username} · ${u.active?'Activo':'Desactivado'} <button onclick="toggle(${u.id},${!u.active})">${u.active?'Desactivar':'Activar'}</button><button onclick="resetPass(${u.id})">Cambiar contraseña</button></li>`).join('')||'<li>No hay usuarios adicionales.</li>'}document.querySelector('#create').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/users','POST',{username:f.get('username'),displayName:f.get('displayName'),password:f.get('password')});e.target.reset();load()}catch(x){alert(x.message)}};async function toggle(id,active){try{await api('/api/users/'+id,'PATCH',{active});load()}catch(x){alert(x.message)}}async function resetPass(id){let password=prompt('Nueva contraseña (mínimo 12 caracteres):');if(password)try{await api('/api/users/'+id,'PATCH',{password});alert('Contraseña actualizada; sus sesiones anteriores quedaron revocadas.')}catch(x){alert(x.message)}}load()</script></body></html>
