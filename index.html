grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}.stat{padding:17px 18px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:8px}.stat span{color:var(--muted);font-size:11px}.section-title{font-size:13px;font-weight:700;color:var(--green);background:#f1efe8;padding:10px 14px}.body{padding:15px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select,.field textarea,.search{width:100%;padding:10px 11px;border:1px solid #d9dbd2;border-radius:6px;background:#fff;font:inherit;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--green);box-shadow:0 0 0 3px #0f6e5618}.field textarea{min-height:68px;resize:vertical}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:12px}th{background:#fafaf7;color:var(--muted);font-weight:600}tbody tr:hover{background:#fbfcf9}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff4dc;color:var(--amber);font-size:11px}.badge.paid{background:#e4f6ed;color:var(--green)}.badge.cancel{background:#fff0ed;color:var(--red)}.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0}.search{max-width:360px}.item-row{display:grid;grid-template-columns:2fr .7fr .8fr .9fr 38px;gap:8px;margin-bottom:8px}.item-row input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}.total-box{margin-left:auto;width:290px;padding:15px;background:#f7faf7;border:1px solid var(--line);border-radius:8px}.total-line{display:flex;justify-content:space-between;margin:5px 0;color:var(--muted)}.total-line.grand{border-top:1px solid var(--line);padding-top:9px;color:var(--ink);font-size:17px;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;color:var(--muted);padding:28px}.notice{padding:13px 15px;background:#eef7f2;border-radius:8px;color:#315d4b;margin-bottom:14px;font-size:13px}.chart{height:180px;display:flex;align-items:end;gap:10px;padding:15px}.barcol{flex:1;text-align:center;color:var(--muted);font-size:10px}.bar{background:#82c9a9;border-radius:5px 5px 0 0;min-height:6px;margin:8px auto 5px;width:70%;max-width:40px}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#14251f88;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:11px;padding:20px;width:min(460px,100%);box-shadow:0 15px 50px #0003}.modal h3{margin-top:0}.right{text-align:right}

  .toolbar{display:block}.search{max-width:none;font-size:16px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:720px}th,td{padding:10px;font-size:11px}

<body><div class="app"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="logo-jireh.svg" alt=""><span class="brand-copy">Encomienda Jireh<small>Versión beta</small></span></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="side-action" id="theme">🌙 Modo oscuro</button><button class="side-action" onclick="backup()">💾 Descargar respaldo</button><small style="display:block;padding:8px;color:#b8cec4">Encomienda Jireh · versión web</small></div></aside><main class="main"><header class="top"><h1 id="pageTitle">Dashboard</h1><select id="mobileMenu" aria-label="Ir a sección"><option value="" selected>☰ Secciones</option></select><span class="date" id="today"></span><button id="clearPreviousMonth" class="btn danger" type="button" onclick="beginPreviousMonthCleanup()">🧹 Limpiar mes anterior</button><form action="/logout" method="post" style="margin:0"><button class="btn secondary" type="submit">Salir</button></form><button id="installApp" class="btn secondary install-app" type="button">⬇ Instalar app</button></header><div class="content" id="view"></div></main></div><div id="modalRoot"></div>
<script>
const pages=[['nueva','➕','Nueva encomienda'],['historial','📋','Historial'],['mensual','📅','Hist. mensual'],['clientes','👤','Hist. clientes'],['costos','💰','Costos viaje'],['cobrar','🧾','Ctas. cobrar'],['arqueo','💵','Arqueo caja'],['kpi','📊','Dashboard KPI'],['reportes','📈','Reportes'],['config','⚙️','Configuración']];function readStore(key){try{return localStorage.getItem(key)||'[]'}catch(e){return '[]'}}function parseStore(key){try{const value=JSON.parse(readStore(key));return Array.isArray(value)?value:[]}catch(e){console.warn('Datos locales inválidos en '+key,e);return []}}let shipments=parseStore('jireh_shipments'),costs=parseStore('jireh_costs'),active='nueva',dark=false;let databaseRevision=0,databaseReady=false,pendingDatabaseWrite=Promise.resolve(),databaseWriteFailed=false;
const nav=document.querySelector('#nav'),view=document.querySelector('#view'),mobileMenu=document.querySelector('#mobileMenu'),todayEl=document.querySelector('#today');function updateNicaraguaClock(){const now=new Date(),date=new Intl.DateTimeFormat('es-NI',{dateStyle:'full',timeZone:'America/Managua'}).format(now),time=new Intl.DateTimeFormat('es-NI',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/Managua'}).format(now);todayEl.innerHTML=`${date} <strong class="nicaragua-time">${time}</strong>`}updateNicaraguaClock();setInterval(updateNicaraguaClock,30000);nav.innerHTML=pages.map(([id,icon,name])=>`<button data-page="${id}">${icon} &nbsp;${name}</button>`).join('');mobileMenu.innerHTML+='<option disabled>──────────</option>'+pages.map(([id,icon,name])=>`<option value="${id}">${icon} ${name}</option>`).join('');nav.onclick=e=>{let b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};mobileMenu.onchange=()=>{if(mobileMenu.value)show(mobileMenu.value)};function money(v){return '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function localDate(){const now=new Date();return new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10)}function save(){try{localStorage.setItem('jireh_shipments',JSON.stringify(shipments));localStorage.setItem('jireh_costs',JSON.stringify(costs))}catch(error){console.warn('No se pudo actualizar la copia local.',error)}if(!databaseReady){setDatabaseStatus('Base SQL desconectada · cambios no guardados');alert('La base SQL no está conectada. No se guardó el cambio; vuelve a conectar el servidor antes de continuar.');return Promise.resolve(false)}pendingDatabaseWrite=pendingDatabaseWrite.then(async()=>{if(databaseWriteFailed)return;setDatabaseStatus('Guardando en SQL…');const response=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:databaseRevision,shipments,costs})});const result=await response.json().catch(()=>({}));if(!response.ok){databaseWriteFailed=true;databaseReady=false;setDatabaseStatus(response.status===409?'Conflicto de otra sesión · recarga la app':'Error al guardar en SQL');console.error(result.error||'No se pudo guardar en la base SQL.');alert((result.error||'No se pudo guardar en la base SQL.')+' No cierres esta pestaña hasta resolverlo.');return}databaseRevision=result.revision;setDatabaseStatus('Base SQL conectada · guardado')}).catch(error=>{databaseWriteFailed=true;databaseReady=false;setDatabaseStatus('Base SQL desconectada · cambios pendientes');console.error('Error al guardar en SQLite:',error);alert('Se perdió la conexión con la base SQL. Los cambios de esta sesión no están confirmados; deja la pestaña abierta y revisa el servidor.')});return pendingDatabaseWrite.then(()=>!databaseWriteFailed)}function show(p){active=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));mobileMenu.value=p;document.querySelector('#pageTitle').textContent=pages.find(x=>x[0]===p)?.[2]||p;({nueva:renderNew,historial:renderHistory,mensual:renderMonth,clientes:renderClients,costos:renderCosts,cobrar:renderDebts,arqueo:renderCash,kpi:renderKpi,reportes:renderReports,config:renderConfig}[p]||renderNew)()}
function renderNew(){view.innerHTML=`<div class="intro"><div><h2>Registrar envío</h2><p>Completa los datos del remitente, destinatario y artículos.</p></div></div><form id="shipment"><div class="grid two"><section class="card"><div class="section-title">👤 REMITENTE</div><div class="body grid two"><div class="field"><label>Nombre *</label><input name="sender" required placeholder="Nombre completo"></div><div class="field"><label>Teléfono</label><input name="senderPhone" placeholder="+1 (000) 000-0000"></div></div></section><section class="card"><div class="section-title">📦 DESTINATARIO</div><div class="body grid two"><div class="field"><label>Nombre *</label><input name="receiver" required placeholder="Nombre completo"></div><div class="field"><label>Teléfono</label><input name="receiverPhone" placeholder="+505 0000 0000"></div><div class="field"><label>Dirección USA</label><input name="address" placeholder="Dirección de entrega"></div><div class="field"><label>Ciudad destino</label><input name="destination" placeholder="Miami, FL"></div></div></section></div><section class="card" style="margin-top:15px"><div class="section-title">📋 DETALLE DE ARTÍCULOS <button class="btn secondary" type="button" onclick="addItem()" style="float:right;padding:4px 10px;margin-top:-4px">＋ Agregar artículo</button></div><div class="body"><div id="items"></div><div class="field" style="max-width:350px;margin-top:12px"><label>Valor de correo externo ($)</label><input name="postage" type="number" min="0" step=".01" value="0" oninput="calc()"></div><div class="total-box"><div class="total-line"><span>Peso total</span><b id="weight">0 lb</b></div><div class="total-line"><span>Valor declarado</span><b id="subtotal">$0.00</b></div><div class="total-line"><span>Correo externo</span><b id="postageTotal">$0.00</b></div><div class="total-line grand"><span>Total</span><b id="grand">$0.00</b></div></div></div></section><div class="grid two" style="margin-top:15px"><section class="card"><div class="section-title">📝 NOTAS</div><div class="body"><div class="field"><label>Observaciones del envío</label><textarea name="note" placeholder="Indicaciones especiales..."></textarea></div></div></section><section class="card"><div class="section-title">💳 ESTADO DE PAGO</div><div class="body grid two"><div class="field"><label>Estado</label><select name="status"><option>Pendiente</option><option>Abono</option><option>Pagado</option></select></div><div class="field"><label>Abono inicial ($)</label><input name="paid" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Tipo de pago</label><select name="payment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div></div></section></div><div class="actions"><button class="btn light" type="reset">Limpiar</button><button class="btn" type="submit">Guardar encomienda</button></div></form>`;addItem();document.querySelector('#shipment').onsubmit=submitShipment}
function addItem(){const row=document.createElement('div');row.className='item-row';row.innerHTML='<input placeholder="Descripción del artículo" required class="desc"><input type="number" min="1" value="1" placeholder="Cantidad" class="qty"><input type="number" min="0" step=".1" value="0" placeholder="Peso (lb)" class="lbs"><input type="number" min="0" step=".01" value="0" placeholder="Valor ($)" class="value"><button type="button" class="btn danger" aria-label="Quitar" onclick="this.parentElement.remove();calc()">×</button>';row.querySelectorAll('input').forEach(i=>i.oninput=calc);document.querySelector('#items').append(row);calc()}function calc(){let rows=[...document.querySelectorAll('.item-row')],weight=0,value=0;rows.forEach(r=>{weight+=Number(r.querySelector('.lbs').value||0)*Number(r.querySelector('.qty').value||1);value+=Number(r.querySelector('.value').value||0)*Number(r.querySelector('.qty').value||1)});let post=Number(document.querySelector('[name=postage]')?.value||0);document.querySelector('#weight').textContent=weight.toFixed(1)+' lb';document.querySelector('#subtotal').textContent=money(value);document.querySelector('#postageTotal').textContent=money(post);document.querySelector('#grand').textContent=money(value+post)}async function submitShipment(e){e.preventDefault();const f=new FormData(e.target),items=[...document.querySelectorAll('.item-row')].map(r=>({description:r.querySelector('.desc').value,qty:+r.querySelector('.qty').value||1,lbs:+r.querySelector('.lbs').value||0,value:+r.querySelector('.value').value||0}));let subtotal=items.reduce((a,x)=>a+x.value*x.qty,0),total=subtotal+(+f.get('postage')||0),paid=+f.get('paid')||0;shipments.unshift({id:Date.now(),code:'ENV-'+String(shipments.length+1).padStart(4,'0'),date:localDate(),sender:f.get('sender'),senderPhone:f.get('senderPhone'),receiver:f.get('receiver'),receiverPhone:f.get('receiverPhone'),address:f.get('address'),destination:f.get('destination')||'Sin asignar',items,weight:items.reduce((a,x)=>a+x.lbs*x.qty,0),subtotal,total,paid,remaining:Math.max(0,total-paid),status:paid>=total?'Pagado':paid>0?'Abono':f.get('status'),payment:f.get('payment'),note:f.get('note')});save();alert('Encomienda guardada correctamente.');show('historial')}

function addProductRow(data={}){const row=document.createElement('div');row.className='article-line product-row';row.innerHTML=`<span class="line-no"></span><input class="desc" placeholder="Descripción" value="${esc(data.description||'')}"><input class="qty" type="number" min="1" value="${data.qty||1}" aria-label="Cantidad"><input class="lbs" type="number" min="0" step=".01" value="${data.lbs||''}" placeholder="Peso lb" aria-label="Peso en libras"><span class="line-total">$0.00</span><button type="button" class="btn danger" onclick="this.closest('.article-line').remove();calc()" aria-label="Eliminar">×</button>`;row.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));document.querySelector('#productRows').append(row);calc()}
function currentArticleItems(){const items=[];document.querySelectorAll('.product-row').forEach(r=>{const description=r.querySelector('.desc').value.trim(),qty=+r.querySelector('.qty').value||1,lbs=+r.querySelector('.lbs').value||0;if(description)items.push({description,qty,lbs,value:0,type:'producto',amount:qty*lbs*ARTICLE_PRICE_PER_LB})});return items}
function calc(){const items=currentArticleItems(),external=+(document.querySelector('[name=postage]')?.value||0);let index=0;document.querySelectorAll('.product-row').forEach(r=>{r.querySelector('.line-no').textContent=++index;r.querySelector('.line-total').textContent=money((+r.querySelector('.qty').value||1)*(+r.querySelector('.lbs').value||0)*ARTICLE_PRICE_PER_LB)});document.querySelectorAll('#specialGroups .special-row').forEach(r=>{r.querySelector('.line-no').textContent=++index});const all=items.concat(JSON.parse(document.querySelector('#specialGroups')?.dataset.items||'[]'));const total=all.reduce((sum,i)=>sum+(+i.amount||0),0)+external,count=all.length;document.querySelector('#grand').textContent=money(total);document.querySelector('#articleCount').textContent=`${count} artículos`;document.querySelector('#articleCountSummary').textContent=`${count} artículos`}
function setSpecialItems(items){const root=document.querySelector('#specialGroups');root.dataset.items=JSON.stringify(items);const groups=[['peso','⚖️ ENVÍOS POR PESO','#633806'],['medicamento','💊 MEDICAMENTOS','#6b2fa0'],['documento','📄 DOCUMENTOS','#9e2a2a'],['varios','📦 ARTÍCULOS VARIOS','#2a5a8a']];root.innerHTML=groups.map(([type,title,color])=>{const rows=items.filter(x=>x.type===type);return rows.length?`<div class="article-group"><h4 style="color:${color}">${title}</h4>${rows.map((x,i)=>`<div class="article-line special-row type-${type}"><span class="line-no">${i+1}</span><span>${esc(x.description)}</span><span>${x.qty>1?'×'+x.qty:''}</span><span>${type==='peso'?x.lbs+' lb':money(x.value)+' c/u'}</span><span class="line-total">${money(x.amount)}</span><button type="button" class="btn danger" onclick="removeSpecialItem('${type}',${i})">×</button></div>`).join('')}</div>`:''}).join('');calc()}

function openWeightItem(){modal(`<div class="article-modal"><h3>⚖️ Envío por peso total</h3><p class="price-hint">Tarifa: $${ARTICLE_PRICE_PER_LB} por libra. Añade el paquete y su peso.</p><div class="field"><label>Descripción del envío</label><textarea id="weightDesc" placeholder="Ej. Caja de ropa"></textarea></div><div class="field"><label>Peso total (lb)</label><input id="weightLbs" type="number" min=".01" step=".01" placeholder="0.00"></div><div id="weightEstimate" class="notice">Costo estimado: $0.00</div><div class="article-actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmWeightItem()">✓ Agregar al envío</button></div></div>`);document.querySelector('#weightLbs').oninput=e=>document.querySelector('#weightEstimate').textContent='Costo estimado: '+money((+e.target.value||0)*ARTICLE_PRICE_PER_LB)}

function openPresetItems(kind){const list=kind==='medicamento'?MEDICINES:DOCUMENTS,title=kind==='medicamento'?'💊 Medicamentos':'📄 Documentos',type=kind;modal(`<div class="article-modal preset-modal"><h3>${title}</h3><p class="price-hint">${kind==='medicamento'?'El precio de cada medicamento es fijo. Ajusta la cantidad que vas a agregar.':'Elige los documentos y define su cantidad. Los precios sugeridos se pueden editar.'}</p><div class="preset-list">${list.map(([name,price])=>{const fixed=+price>0,priceField=fixed?`<span class="preset-fixed-price">${money(price)} <small>precio fijo</small></span><input class="preset-price" type="hidden" value="${price}">`:`<label class="preset-price-edit">Precio ($)<input class="preset-price" type="number" min="0" step=".01" value="${price}" aria-label="Precio unitario de ${esc(name)}"></label>`;return `<div class="preset-row"><div class="preset-item-details"><strong>${esc(name)}</strong>${priceField}</div><div class="preset-qty-cell"><span class="preset-qty-label">Cantidad</span><div class="preset-qty-stepper"><button type="button" aria-label="Reducir cantidad de ${esc(name)}" onclick="changePresetQty(this,-1)">−</button><input class="preset-qty" type="number" min="0" step="1" inputmode="numeric" value="0" aria-label="Cantidad de ${esc(name)}" onchange="this.value=Math.max(0,Math.floor(+this.value||0))"><button type="button" aria-label="Aumentar cantidad de ${esc(name)}" onclick="changePresetQty(this,1)">+</button></div></div></div>`}).join('')}</div><div class="article-actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmPresetItems('${type}')">✓ Agregar seleccionados</button></div></div>`)}

async function submitShipment(e){e.preventDefault();const f=new FormData(e.target),items=currentArticleItems().concat(JSON.parse(document.querySelector('#specialGroups').dataset.items||'[]'));if(!items.length)return alert('Agrega al menos un artículo.');const subtotal=items.reduce((a,x)=>a+(+x.amount||0),0),postage=+f.get('postage')||0,total=subtotal+postage,paid=+f.get('paid')||0,date=localDate();shipments.unshift({id:Date.now(),code:'ENV-'+String(shipments.length+1).padStart(4,'0'),date,sender:f.get('sender'),senderPhone:f.get('senderPhone'),receiver:f.get('receiver'),receiverPhone:f.get('receiverPhone'),address:f.get('address'),destination:f.get('destination')||'Sin asignar',items,weight:items.reduce((a,x)=>a+(+x.lbs||0)*(+x.qty||1),0),subtotal,total,paid,remaining:Math.max(0,total-paid),status:paid>=total?'Pagado':paid>0?'Abono':f.get('status'),payment:f.get('payment'),payments:paid>0?[{date,amount:paid,type:f.get('payment')}]:[],note:[f.get('postagePlace'),f.get('note')].filter(Boolean).join(' · ')});save();alert('Encomienda guardada correctamente.');show('historial')}

<script>
function setSpecialItems(items){const root=document.querySelector('#specialGroups');root.dataset.items=JSON.stringify(items);const groups=[['peso','⚖️ ENVÍOS POR PESO','#633806'],['medicamento','💊 MEDICAMENTOS','#6b2fa0'],['documento','📄 DOCUMENTOS','#9e2a2a'],['varios','📦 ARTÍCULOS VARIOS','#2a5a8a']];root.innerHTML=groups.map(([type,title,color])=>{const rows=items.filter(x=>x.type===type);return rows.length?`<div class="article-group"><h4 style="color:${color}">${title}</h4>${rows.map((x,i)=>`<div class="article-line special-row"><span class="line-no">${i+1}</span><span>${esc(x.description)}</span><span>${x.qty>1?'×'+x.qty:''}</span><span>${type==='peso'?x.lbs+' lb':money(x.value)+' c/u'}</span><span class="line-total">${money(x.amount)}</span><span class="article-row-actions"><button type="button" class="btn secondary" title="Editar artículo" aria-label="Editar ${esc(x.description)}" onclick="editSpecialItem('${type}',${i})">✎</button><button type="button" class="btn danger" title="Eliminar artículo" aria-label="Eliminar ${esc(x.description)}" onclick="removeSpecialItem('${type}',${i})">×</button></span></div>`).join('')}</div>`:''}).join('');calc()}
function editSpecialItem(type,index){const items=JSON.parse(document.querySelector('#specialGroups').dataset.items||'[]'),item=items.filter(x=>x.type===type)[index];if(!item)return;const weight=type==='peso';modal(`<div class="article-modal"><h3>✎ Editar artículo</h3><div class="field"><label>Descripción</label><input id="specialEditDesc" value="${esc(item.description)}"></div>${weight?`<div class="field"><label>Peso total (lb)</label><input id="specialEditLbs" type="number" min=".01" step=".01" value="${+item.lbs||0}"></div><div class="notice">Tarifa: $${ARTICLE_PRICE_PER_LB} por libra</div>`:`<div class="grid two"><div class="field"><label>Cantidad</label><input id="specialEditQty" type="number" min="1" step="1" value="${+item.qty||1}"></div><div class="field"><label>Precio unitario ($)</label><input id="specialEditPrice" type="number" min="0" step=".01" value="${+item.value||0}"></div></div>`}<div class="article-actions"><button class="btn light" type="button" onclick="closeModal()">Cancelar</button><button class="btn" type="button" onclick="saveSpecialEdit('${type}',${index})">Guardar cambios</button></div></div>`)}
function saveSpecialEdit(type,index){const items=JSON.parse(document.querySelector('#specialGroups').dataset.items||'[]'),matches=items.filter(x=>x.type===type),item=matches[index];if(!item)return;item.description=document.querySelector('#specialEditDesc').value.trim()||item.description;if(type==='peso'){item.lbs=+document.querySelector('#specialEditLbs').value||0;if(item.lbs<=0)return alert('Ingresa un peso válido.');item.qty=1;item.value=0;item.amount=item.lbs*ARTICLE_PRICE_PER_LB}else{item.qty=+document.querySelector('#specialEditQty').value||1;item.value=+document.querySelector('#specialEditPrice').value||0;item.amount=item.qty*item.value}setSpecialItems(items);closeModal()}
show(active);
</script>
<script>
// Etiqueta celdas con su encabezado y convierte las tablas dinámicas en tarjetas móviles.
(function(){
  const root=document.querySelector('#view');
  if(!root)return;
  function prepareTables(){
    root.querySelectorAll('.table-wrap table').forEach(table=>{
      table.classList.add('mobile-card-table');
      const rows=[...table.rows],header=rows.find(row=>[...row.cells].some(cell=>cell.tagName==='TH'));
      if(!header)return;
      const labels=[...header.cells].map((cell,index)=>cell.textContent.trim()|| (index===header.cells.length-1?'Acciones':''));
      if(!table.tHead)header.classList.add('mobile-table-header');
      rows.filter(row=>row!==header).forEach(row=>[...row.cells].forEach((cell,index)=>{
        cell.dataset.label=labels[index]||'Detalle';
        if(index===row.cells.length-1&&cell.querySelector('button'))cell.classList.add('mobile-table-actions');
      }));
    });
  }
  prepareTables();
  new MutationObserver(prepareTables).observe(root,{childList:true,subtree:true});
})();
</script>

<script>
(()=>{
  const button=document.getElementById('installApp'), overlay=document.getElementById('installHelp'), text=document.getElementById('installHelpText');
  let installPrompt=null;
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const showHelp=(html)=>{text.innerHTML=html;overlay.hidden=false};
  const hideHelp=()=>overlay.hidden=true;
  document.getElementById('closeInstallHelp').addEventListener('click',hideHelp);
  overlay.addEventListener('click',e=>{if(e.target===overlay)hideHelp()});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;button.hidden=false});
  window.addEventListener('appinstalled',()=>{installPrompt=null;button.hidden=true});
  if(isStandalone())button.hidden=true;
  button.addEventListener('click',async()=>{
    if(isStandalone())return;
    if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}
    const ua=navigator.userAgent;
    if(location.protocol==='file:'){
      showHelp('<p>Esta página está abierta como un archivo local. Chrome no permite instalarla así. Para habilitar la instalación en Windows, Mac, Android y iPhone, publica la app en un sitio con <strong>HTTPS</strong> y vuelve a abrirla desde su dirección web.</p>');
    }else if(/iPhone|iPad|iPod/i.test(ua)){
      showHelp('<p>En Safari, toca <strong>Compartir</strong> (el cuadrado con la flecha hacia arriba) y elige <strong>Agregar a pantalla de inicio</strong>. Luego toca <strong>Agregar</strong>.</p>');
    }else if(/Android/i.test(ua)){
      showHelp('<p>En Chrome, abre el menú <strong>⋮</strong> y toca <strong>Instalar app</strong> o <strong>Agregar a pantalla principal</strong>.</p>');
    }else if(/Macintosh|Mac OS X/i.test(ua)){
      showHelp('<p>En Safari, elige <strong>Archivo → Agregar al Dock</strong>. En Chrome o Edge, usa el icono de instalación de la barra de direcciones o el menú del navegador.</p>');
    }else{
      showHelp('<p>En Chrome o Edge, usa el icono de instalación de la barra de direcciones o abre el menú del navegador y selecciona <strong>Instalar Encomienda Jireh</strong>.</p>');
    }
  });
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('No se pudo activar el modo de aplicación:',err)));
})();
</script>

/* Ajustes comunes para que los componentes se adapten sin desbordar la pantalla. */
html{max-width:100%;overflow-x:hidden}body,.app,.main,.content{min-width:0;max-width:100%}
@media (min-width:651px) and (max-width:1450px){.top{height:auto;min-height:64px;padding:10px clamp(14px,2vw,24px);gap:10px;flex-wrap:wrap;justify-content:flex-start}.top h1{flex:1 1 160px}.top .date{flex:1 1 220px}.top form,.top>.btn{flex:0 1 auto}#databaseStatus{margin-left:auto;white-space:normal!important}}img,svg,canvas,video{max-width:100%}.grid>*{min-width:0}.field,.field input,.field select,.field textarea,.search{min-width:0}.btn{max-width:100%;white-space:normal;overflow-wrap:anywhere}.top>*{min-width:0}
@media (min-width:651px) and (max-width:1100px){
  .sidebar{width:190px}.brand{padding:18px 14px}.content{padding:clamp(16px,2.4vw,26px)}
  .top{height:auto;min-height:64px;padding:10px 18px;gap:10px;flex-wrap:wrap;justify-content:flex-start}
  .top h1{flex:1 1 180px}.top .date{flex:1 1 230px}.top .btn,.top form{flex:0 1 auto}
  .two,.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}.item-row{grid-template-columns:minmax(0,2fr) repeat(3,minmax(65px,.8fr)) 38px}
  .total-box{width:min(100%,290px)}
}
@media(max-width:650px){
  html,body{width:100%;overflow-x:hidden}.app{display:block;width:100%;min-height:100dvh}
  .sidebar{width:100%;max-width:100%}.main{width:100%;max-width:100%;overflow-x:clip}
  .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,.8fr);align-items:center;gap:8px;width:100%;min-width:0;padding:10px 12px}
  .top h1{grid-column:1;grid-row:1;min-width:0;font-size:clamp(15px,4vw,19px);overflow-wrap:anywhere}
  #mobileMenu{grid-column:2;grid-row:1;width:100%;max-width:none;min-width:0}
  #clearPreviousMonth{grid-column:1/-1;width:100%;min-height:42px;padding:9px 12px;font-size:13px}
  .top form{width:100%;min-width:0}.top form .btn,.top>.install-app{width:100%;min-height:42px;padding:9px 10px}
  #databaseStatus{grid-column:1/-1;white-space:normal!important;overflow-wrap:anywhere}
  .content{width:100%;max-width:100%;padding:14px 12px calc(26px + env(safe-area-inset-bottom))}
  .intro,.toolbar,.actions,.history-pagination,.report-toolbar{min-width:0;flex-wrap:wrap}
  .two,.three{grid-template-columns:minmax(0,1fr)}.stats,.cash-stats,.report-stats,.month-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item-row{grid-template-columns:repeat(2,minmax(0,1fr))}.item-row>*{min-width:0}.item-row input{min-width:0}
  .table-wrap{max-width:100%}.chart,.month-chart-scroll{max-width:100%;overscroll-behavior-x:contain}
  .modal-back{width:100%;max-width:100%}.modal{width:min(100%,760px);max-width:100%;min-width:0}
  .preset-modal,.preset-row{min-width:0}.preset-row{grid-template-columns:minmax(0,1fr) minmax(120px,142px)}
}
@media(max-width:380px){
  .content{padding-left:9px;padding-right:9px}.top{padding:9px;gap:7px}.top h1{font-size:15px}
  .stats,.cash-stats,.report-stats,.month-stats{grid-template-columns:minmax(0,1fr)}
  .field input,.field select,.field textarea{padding-left:9px;padding-right:9px}
  .preset-row{grid-template-columns:minmax(0,1fr)}.preset-qty-stepper{width:100%}
  .history-actions{max-width:100%;flex-wrap:wrap}.history-pagination label{flex-wrap:wrap}
}
@media(orientation:landscape) and (max-height:500px) and (max-width:900px){.brand{padding-top:7px;padding-bottom:7px}.top{position:relative}.modal{max-height:92dvh}}
</style>
<script>
function setDatabaseStatus(message){let badge=document.querySelector('#databaseStatus');if(!badge){badge=document.createElement('span');badge.id='databaseStatus';badge.style.cssText='font-size:11px;color:#0f6e56;white-space:nowrap';document.querySelector('.top')?.append(badge)}badge.textContent=message}
async function initializeDatabase(){setDatabaseStatus('Conectando a SQLite…');view.innerHTML='<section class="card"><div class="body">Conectando con la base SQL local…</div></section>';try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw new Error('El servidor rechazó la lectura de la base de datos.');let state=await response.json();databaseRevision=state.revision;const localShipments=parseStore('jireh_shipments'),localCosts=parseStore('jireh_costs');if(state.revision===0&&(localShipments.length||localCosts.length)){setDatabaseStatus('Importando datos locales a SQL…');const migrated=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:0,shipments:localShipments,costs:localCosts})});const result=await migrated.json().catch(()=>({}));if(!migrated.ok)throw new Error(result.error||'No se pudieron importar los datos locales.');state=result}shipments=state.shipments;costs=state.costs;databaseRevision=state.revision;databaseReady=true;databaseWriteFailed=false;try{localStorage.setItem('jireh_shipments',JSON.stringify(shipments));localStorage.setItem('jireh_costs',JSON.stringify(costs))}catch(e){console.warn('No se pudo actualizar la copia local.',e)}setDatabaseStatus('Base SQL conectada · revisión '+databaseRevision);show(active)}catch(error){databaseReady=false;setDatabaseStatus('Error de base SQL');view.innerHTML='<section class="card"><div class="section-title">No se pudo abrir la base de datos</div><div class="body"><p>'+esc(error.message)+'</p><p>Los registros locales siguen intactos. Inicia el servidor Flask y vuelve a cargar esta página.</p><button class="btn" onclick="location.reload()">Reintentar conexión</button></div></section>';console.error(error)}}
initializeDatabase();
</script>
</body></html>
